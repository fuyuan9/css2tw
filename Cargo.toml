[workspace]
members = [
    "crates/css2tw-core",
    "crates/css2tw-cli",
    "crates/xtask"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["css2tw contributors"]
license = "MIT"
repository = "https://github.com/fuyuan9/css2tw"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
rayon = "1.10"
ignore = "0.4"
clap = { version = "4.5", features = ["derive"] }
schemars = "0.8"
colored = "3.0"
similar = "2.5"
