<!DOCTYPE html>
<html>
<body>
    <!-- Basic and tag-specific -->
    <div class="text-box">Div text box</div>
    <input class="text-box" value="Input text box">

    <!-- Pseudo classes -->
    <button class="interactive">Interactive Button</button>

    <!-- Pseudo elements -->
    <div class="item">List item with bullet</div>

    <!-- Combinators -->
    <div class="container">
        <span class="child">Indented child</span>
    </div>

    <ul class="list">
        <li class="item">List item 1</li>
        <li class="item">List item 2</li>
    </ul>

    <!-- Specificity -->
    <h1 id="unique-header" class="header">Main Title</h1>

    <!-- Scale -->
    <div class="scaled">Scaled box</div>
</body>
</html>
